<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Sign-Up</title>
</head>
<body>
  <div class="imgs">
    <img src="imgs/grass.jpg" alt="" class="grassimg">
    <div class="logo">
      <img src="imgs/logo.png" class="logoimg">
      ODIN
    </div>
  </div>
  <div class="formpage">
    <div class="box1">
      <p class="headtext">
        This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams. Sign up <i>now</i> to get started.
        <br>
        <br>
        You <i>know</i> you want to.
      </p>
    </div>
    <div class="box2">
      <h2>Let's do this!</h2>
      <form action="" method="post" class="forminput">
          <div class="forminput1">
          <label for="userfirstname">FIRST NAME</label>
          <input type="text" name="userfirstname" 
          id="userfirstname" required>
          <label for="useremail">EMAIL</label>
          <input type="email" name="useremail" id="useremail" required>
           <label for="userpassword">PASSWORD</label>
          <input type="password" name="userpassword" id="userpassword" required>
        </div>
        <div class="forminput2">
          <label for="userlastname">LAST NAME</label>
          <input type="text" name="userlastname" id="userlastname" required>
          <label for="">PHONE NUMBER</label>
          <input type="number" name="usernumber" id="usernumber" required>
          <label for="confirmpassword">CONFIRM PASSWORD</label>
          <input type="password" name="confirmpassword" id="confirmpassword" required>
        </div>
        </form>
    </div>
    <div class="box3">
      <button class="createaccount">Create Account</button>
      <br>
      <p>Already have an account? <a href="">Log in</a></p>
    </div>
  </div>
</body>
</html>
